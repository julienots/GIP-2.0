name: APK Android

on:
  push:
    branches: ['**']
    paths: ['android/**', 'src/renderer/pages/**', 'src/main/blocklist.js', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compiler l'APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Gip-2.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Gip-2.0-apk
          path: Gip-2.0.apk

      - name: Publier une version téléchargeable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Gip-2.0.apk \
            --target "$GITHUB_SHA" \
            --title "Gip 2.0 Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK compilé automatiquement depuis la branche ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Android 10 ou plus récent." \
            --prerelease
